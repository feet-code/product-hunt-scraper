[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-hunt-magic-catalog-importer"
version = "0.1.0"
description = "Restart-safe Product Hunt research and Magic Catalog import pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ph-magic-import = "product_hunt_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

